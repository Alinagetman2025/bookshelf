<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOOKSHELF</title>
  </head>
  <body>
    <!doctype html>
    <html lang="ru">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Книжный секвенсор · Tone.js</title>
        <!-- Tone.js CDN -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
        <style>
          * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
          }

          body {
            background-color: #24253a;
            font-family: "Segoe UI", "Duolingo Sans", system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            color: #f0f0f0;
          }

          /* Основной контейнер — две равные половины */
          .app {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            width: 100%;
          }

          /* ========== ЛЕВАЯ ПАНЕЛЬ (СЕКВЕНСОР) ========== */
          .sequencer-panel {
            background-color: #24253a;
            padding: 24px 22px 18px 22px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-right: 2px solid #3a3c55;
          }

          .panel-header h1 {
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 6px;
            text-shadow: 0 3px 0 #12132a;
          }

          .panel-header p {
            color: #a0a2c0;
            font-size: 0.95rem;
            margin-bottom: 22px;
            font-weight: 500;
          }

          /* Сетка секвенсора */
          .track-labels {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 6px 8px;
            margin-bottom: 18px;
          }

          .track-name {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: #c0c2e0;
            display: flex;
            align-items: center;
            padding-left: 4px;
          }

          .steps-row {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 4px;
            align-items: center;
          }

          .step-cell {
            height: 30px;
            background: #37464f;
            border-radius: 8px;
            border-bottom: 3px solid #1f2c33;
            cursor: pointer;
            transition:
              background 0.08s,
              transform 0.1s,
              border-bottom 0.1s;
            box-shadow: 0 2px 0 #1f2c33;
          }

          .step-cell:hover {
            background: #3f5563;
          }

          .step-cell.on {
            background: #58cc02;
            border-bottom: 3px solid #2e7a00;
            box-shadow: 0 2px 0 #2e7a00;
          }

          .step-cell.current {
            background: #89e219;
            border-bottom: 3px solid #4b9e00;
            transform: scale(0.92);
            box-shadow: 0 0 10px #89e219aa;
            transition:
              transform 0.06s,
              background 0.06s;
          }

          /* Кнопки управления */
          .controls-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin: 26px 0 28px 0;
          }

          .btn {
            background: #37464f;
            border: none;
            border-bottom: 4px solid #1f2c33;
            border-radius: 14px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.08s;
            box-shadow: 0 3px 0 #1f2c33;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            min-width: 82px;
          }

          .btn:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
            box-shadow: 0 1px 0 #1f2c33;
          }

          .btn.play {
            background: #58cc02;
            border-bottom-color: #2e7a00;
            color: #1e2a0e;
          }

          .btn.stop {
            background: #e24540;
            border-bottom-color: #8f1f1b;
          }

          .btn.clear {
            background: #7269a6;
            border-bottom-color: #4a416b;
          }

          .status-text {
            margin-left: auto;
            font-weight: 700;
            font-size: 1rem;
            background: #2d2f4a;
            padding: 10px 18px;
            border-radius: 30px;
            border-bottom: 3px solid #1d1f32;
            color: #b9bbdd;
            letter-spacing: 0.8px;
          }

          /* Слайдеры */
          .sliders-section {
            display: flex;
            flex-direction: column;
            gap: 22px;
            margin-top: 8px;
            margin-bottom: 18px;
          }

          .slider-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
          }

          .slider-label {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.9rem;
            color: #c6c8e8;
            letter-spacing: 0.4px;
          }

          .slider-label span:first-child {
            text-transform: uppercase;
          }

          .slider-label .value {
            background: #2d2f4a;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #89e219;
            border-bottom: 2px solid #1d1f32;
          }

          input[type="range"] {
            width: 100%;
            height: 8px;
            background: #37464f;
            border-radius: 10px;
            outline: none;
            border-bottom: 2px solid #1f2c33;
            cursor: pointer;
          }

          input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #58cc02;
            border-radius: 50%;
            box-shadow:
              0 4px 0 #2e7a00,
              0 6px 8px rgba(0, 0, 0, 0.4);
            border: 2px solid #ffffff30;
            transition: 0.05s;
            cursor: pointer;
          }

          input[type="range"]::-webkit-slider-thumb:hover {
            background: #6ed804;
          }

          input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            background: #58cc02;
            border-radius: 50%;
            border: 2px solid #ffffff30;
            box-shadow:
              0 4px 0 #2e7a00,
              0 6px 8px rgba(0, 0, 0, 0.4);
            cursor: pointer;
          }

          /* ========== ПРАВАЯ ПАНЕЛЬ — КНИЖНЫЙ ШКАФ ========== */
          .bookshelf-panel {
            background: #7269a6; /* основной оттенок шкафа */
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0;
          }

          .shelf-row {
            flex: 1; /* четыре равные полки */
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 6px 8px;
            padding: 12px 10px 10px 10px;
            position: relative;
            background: #7269a6; /* базовый цвет полки */
            border-bottom: 6px solid #5a5280;
            box-shadow: inset 0 -4px 0 #4e4670;
            overflow-y: auto;
          }

          .shelf-row:last-child {
            border-bottom: none;
          }

          /* Книги — хаотичный вид за счёт разной высоты и небольших сдвигов */
          .book {
            width: 18px; /* базовая ширина, будем варьировать */
            min-width: 16px;
            border-radius: 4px 4px 2px 2px;
            cursor: pointer;
            transition:
              transform 0.05s,
              filter 0.1s;
            box-shadow:
              1px 2px 3px rgba(0, 0, 0, 0.4),
              inset -1px -1px 0 rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            font-size: 7px;
            font-weight: 700;
            color: #ffffff90;
            text-shadow: 0 1px 2px black;
            padding-bottom: 3px;
            /* подписи не выводим, но можно легко добавить позже */
          }

          .book:hover {
            transform: scale(1.08);
            filter: brightness(1.2);
            z-index: 5;
          }

          .book:active {
            transform: scale(0.95);
          }

          /* Пастельные оттенки из палитры: #FFDFDF, #E24540, #6A9C13 */
          /* Но также добавим вариации, сохраняя общую гамму */
          .book-color-1 {
            background: #ffdfdf;
          }
          .book-color-2 {
            background: #e24540;
          }
          .book-color-3 {
            background: #6a9c13;
          }
          .book-color-4 {
            background: #f5c2c2;
          }
          .book-color-5 {
            background: #d63b36;
          }
          .book-color-6 {
            background: #7eb51a;
          }

          /* Для хаотичности зададим случайные высоты через inline-стили в JS,
       но также немного варьируем в CSS */
          .book {
            height: 70%; /* будет переопределено в JS */
          }
        </style>
      </head>
      <body>
        <div class="app">
          <!-- ЛЕВАЯ ПОЛОВИНА: СЕКВЕНСОР -->
          <div class="sequencer-panel">
            <div class="panel-header">
              <h1>Секвенсор</h1>
              <p>4 дорожки · 16 шагов</p>
            </div>

            <!-- Сетка дорожек -->
            <div class="track-labels" id="sequencerGrid">
              <!-- Строки генерируются JS, но можно и вручную, однако для гибкости сделаем через JS -->
            </div>

            <!-- Кнопки управления -->
            <div class="controls-bar">
              <button class="btn" id="recBtn" title="запись (пока не активна)">
                ⏺ REC
              </button>
              <button class="btn play" id="playBtn">▶ PLAY</button>
              <button class="btn stop" id="stopBtn">⏹ STOP</button>
              <button class="btn clear" id="clearBtn">✕ CLEAR</button>
              <div class="status-text" id="statusDisplay">READY</div>
            </div>

            <!-- Слайдеры -->
            <div class="sliders-section">
              <div class="slider-item">
                <div class="slider-label">
                  <span>VOL</span>
                  <span class="value" id="volValue">70</span>
                </div>
                <input
                  type="range"
                  id="volSlider"
                  min="0"
                  max="100"
                  value="70"
                  step="1"
                />
              </div>
              <div class="slider-item">
                <div class="slider-label">
                  <span>REV</span>
                  <span class="value" id="revValue">25</span>
                </div>
                <input
                  type="range"
                  id="revSlider"
                  min="0"
                  max="100"
                  value="25"
                  step="1"
                />
              </div>
              <div class="slider-item">
                <div class="slider-label">
                  <span>BPM</span>
                  <span class="value" id="bpmValue">100</span>
                </div>
                <input
                  type="range"
                  id="bpmSlider"
                  min="40"
                  max="200"
                  value="100"
                  step="1"
                />
              </div>
            </div>
          </div>

          <!-- ПРАВАЯ ПОЛОВИНА: КНИЖНЫЙ ШКАФ (4 полки) -->
          <div class="bookshelf-panel" id="bookshelf">
            <!-- 4 полки будут сгенерированы в JS -->
          </div>
        </div>

        <script>
          (function () {
            // ---------- 1. НАСТРОЙКА TONE.JS ----------
            // Реверб
            const reverb = new Tone.Reverb({
              decay: 2.5,
              preDelay: 0.02,
              wet: 0.25, // начальное значение 25%
            }).toDestination();

            // Мастер-громкость (через Tone.Destination.volume)
            Tone.Destination.volume.value = -10; // примерно 70 из 100, точнее настроим через слайдер

            // Дополнительная громкость для совместимости (Tone.Destination.volume)
            // Будем обновлять напрямую.

            // Синтезаторы для 4 дорожек (разные тембры для интереса)
            const trackSynths = [
              new Tone.Synth({
                oscillator: { type: "sine" },
                envelope: {
                  attack: 0.01,
                  decay: 0.2,
                  sustain: 0.3,
                  release: 0.5,
                },
              }).connect(reverb),
              new Tone.Synth({
                oscillator: { type: "triangle" },
                envelope: {
                  attack: 0.02,
                  decay: 0.3,
                  sustain: 0.2,
                  release: 0.4,
                },
              }).connect(reverb),
              new Tone.Synth({
                oscillator: { type: "sawtooth" },
                envelope: {
                  attack: 0.01,
                  decay: 0.1,
                  sustain: 0.1,
                  release: 0.3,
                },
              }).connect(reverb),
              new Tone.Synth({
                oscillator: { type: "square" },
                envelope: {
                  attack: 0.01,
                  decay: 0.15,
                  sustain: 0.2,
                  release: 0.3,
                },
              }).connect(reverb),
            ];

            // Ноты для каждой дорожки (разные высоты, чтобы звучало приятно)
            const trackNotes = [
              ["C4", "E4", "G4", "B4", "D5", "F5", "A5", "C6"], // Природа (светлые)
              ["C3", "D3", "E3", "G3", "A3", "C4", "D4", "E4"], // Инстр.
              ["C5", "D5", "E5", "G5", "A5", "C6", "D6", "E6"], // Животные (высокие)
              ["C2", "G2", "C3", "G3", "C4", "G4", "C5", "G5"], // Свои
            ];

            // ---------- 2. СОСТОЯНИЕ СЕКВЕНСОРА ----------
            const numTracks = 4;
            const numSteps = 16;
            // Матрица: 4 дорожки × 16 шагов (boolean)
            let grid = Array(numTracks)
              .fill()
              .map(() => Array(numSteps).fill(false));

            let isPlaying = false;
            let currentStep = 0;
            let sequenceInterval = null; // вместо Tone.Loop для простоты и контроля

            // DOM элементы
            const sequencerGrid = document.getElementById("sequencerGrid");
            const statusDisplay = document.getElementById("statusDisplay");
            const playBtn = document.getElementById("playBtn");
            const stopBtn = document.getElementById("stopBtn");
            const clearBtn = document.getElementById("clearBtn");
            const recBtn = document.getElementById("recBtn");
            const volSlider = document.getElementById("volSlider");
            const volValue = document.getElementById("volValue");
            const revSlider = document.getElementById("revSlider");
            const revValue = document.getElementById("revValue");
            const bpmSlider = document.getElementById("bpmSlider");
            const bpmValue = document.getElementById("bpmValue");

            // ---------- 3. ОТРИСОВКА СЕТКИ СЕКВЕНСОРА ----------
            const trackNames = ["ПРИРОДА", "ИНСТР.", "ЖИВОТНЫЕ", "СВОИ"];

            function renderSequencer() {
              sequencerGrid.innerHTML = "";
              for (let t = 0; t < numTracks; t++) {
                // Левая колонка с названием дорожки
                const nameDiv = document.createElement("div");
                nameDiv.className = "track-name";
                nameDiv.textContent = trackNames[t];
                sequencerGrid.appendChild(nameDiv);

                // Правая колонка с шагами
                const stepsRow = document.createElement("div");
                stepsRow.className = "steps-row";
                stepsRow.dataset.track = t;

                for (let s = 0; s < numSteps; s++) {
                  const cell = document.createElement("div");
                  cell.className = "step-cell";
                  if (grid[t][s]) cell.classList.add("on");
                  cell.dataset.track = t;
                  cell.dataset.step = s;
                  cell.addEventListener("click", () => toggleStep(t, s));
                  stepsRow.appendChild(cell);
                }
                sequencerGrid.appendChild(stepsRow);
              }
            }

            // Переключение шага
            function toggleStep(track, step) {
              grid[track][step] = !grid[track][step];
              updateCellUI(track, step);
            }

            function updateCellUI(track, step) {
              const stepsRows = document.querySelectorAll(".steps-row");
              if (stepsRows[track]) {
                const cell = stepsRows[track].children[step];
                if (cell) {
                  if (grid[track][step]) {
                    cell.classList.add("on");
                  } else {
                    cell.classList.remove("on");
                  }
                }
              }
            }

            // Обновление подсветки текущего шага
            function highlightStep(step) {
              // Убираем подсветку со всех ячеек
              document
                .querySelectorAll(".step-cell")
                .forEach((cell) => cell.classList.remove("current"));
              // Добавляем на текущий шаг во всех дорожках
              for (let t = 0; t < numTracks; t++) {
                const stepsRows = document.querySelectorAll(".steps-row");
                if (stepsRows[t]) {
                  const cell = stepsRows[t].children[step];
                  if (cell) cell.classList.add("current");
                }
              }
            }

            function clearHighlight() {
              document
                .querySelectorAll(".step-cell")
                .forEach((cell) => cell.classList.remove("current"));
            }

            // ---------- 4. ВОСПРОИЗВЕДЕНИЕ ----------
            function playStep(step) {
              // Для каждой дорожки, если шаг активен — играем ноту
              for (let t = 0; t < numTracks; t++) {
                if (grid[t][step]) {
                  const noteArray = trackNotes[t];
                  // Выбираем ноту в зависимости от шага (чтобы было разнообразие)
                  const note = noteArray[step % noteArray.length];
                  trackSynths[t].triggerAttackRelease(note, "16n");
                }
              }
            }

            function startSequencer() {
              if (isPlaying) return;
              // Возобновляем аудиоконтекст при необходимости
              if (Tone.context.state !== "running") {
                Tone.start().then(() => {
                  actuallyStart();
                });
              } else {
                actuallyStart();
              }
            }

            function actuallyStart() {
              if (isPlaying) return;
              isPlaying = true;
              statusDisplay.textContent = "PLAYING";
              currentStep = 0;

              // BPM из слайдера
              const bpm = parseInt(bpmSlider.value, 10);
              Tone.Transport.bpm.value = bpm;

              // Используем Tone.Transport для синхронизации, но так как мы хотим подсветку,
              // будем использовать Transport.scheduleRepeat
              if (sequenceInterval) {
                Tone.Transport.clear(sequenceInterval);
              }

              // Очищаем все запланированные события
              Tone.Transport.cancel();

              // Планируем повтор
              sequenceInterval = Tone.Transport.scheduleRepeat((time) => {
                // step выполняется в аудио-времени, но мы обновляем UI
                const stepToPlay = currentStep;
                // Играем ноты (используем time для точности)
                for (let t = 0; t < numTracks; t++) {
                  if (grid[t][stepToPlay]) {
                    const noteArray = trackNotes[t];
                    const note = noteArray[stepToPlay % noteArray.length];
                    trackSynths[t].triggerAttackRelease(note, "16n", time);
                  }
                }
                // Обновляем UI в следующем тике (чтобы не блокировать аудио-поток)
                Tone.Draw.schedule(() => {
                  highlightStep(stepToPlay);
                }, time);

                // Переключаем шаг
                currentStep = (currentStep + 1) % numSteps;
              }, "16n");

              Tone.Transport.start();
            }

            function stopSequencer() {
              if (!isPlaying) return;
              isPlaying = false;
              statusDisplay.textContent = "STOPPED";
              Tone.Transport.stop();
              Tone.Transport.cancel();
              if (sequenceInterval) {
                Tone.Transport.clear(sequenceInterval);
                sequenceInterval = null;
              }
              clearHighlight();
              currentStep = 0;
              // Обновим статус
            }

            // ---------- 5. ОБРАБОТЧИКИ КНОПОК ----------
            playBtn.addEventListener("click", () => {
              startSequencer();
            });

            stopBtn.addEventListener("click", () => {
              stopSequencer();
            });

            clearBtn.addEventListener("click", () => {
              // Очищаем все шаги
              for (let t = 0; t < numTracks; t++) {
                for (let s = 0; s < numSteps; s++) {
                  grid[t][s] = false;
                }
              }
              renderSequencer(); // перерисовываем
              // Если играет — остановим?
              // Не обязательно, но можно остановить для чистоты
              if (isPlaying) {
                stopSequencer();
              } else {
                statusDisplay.textContent = "CLEARED";
                setTimeout(() => {
                  if (!isPlaying) statusDisplay.textContent = "READY";
                }, 800);
              }
              clearHighlight();
            });

            recBtn.addEventListener("click", () => {
              // Заглушка — можно добавить запись, но пока просто индикация
              alert("Функция REC в разработке. Используйте клики по клеткам.");
            });

            // ---------- 6. СЛАЙДЕРЫ ----------
            // VOL: 0-100 -> Tone.Destination.volume от -60 до 0 дБ (или используем линейно)
            function updateVolume(value) {
              // value 0-100, преобразуем в дБ: 0 -> -60дБ, 100 -> 0дБ
              const db = value === 0 ? -60 : 20 * Math.log10(value / 100);
              Tone.Destination.volume.value = db;
              volValue.textContent = value;
            }

            volSlider.addEventListener("input", (e) => {
              const val = parseInt(e.target.value, 10);
              updateVolume(val);
            });

            // REV: 0-100 -> wet 0..1
            revSlider.addEventListener("input", (e) => {
              const val = parseInt(e.target.value, 10);
              reverb.wet.value = val / 100;
              revValue.textContent = val;
            });

            // BPM: 40-200
            bpmSlider.addEventListener("input", (e) => {
              const val = parseInt(e.target.value, 10);
              bpmValue.textContent = val;
              if (isPlaying) {
                Tone.Transport.bpm.value = val;
              }
            });

            // Инициализация значений
            updateVolume(70);
            reverb.wet.value = 0.25;
            revValue.textContent = "25";
            bpmValue.textContent = "100";
            Tone.Transport.bpm.value = 100;

            // ---------- 7. КНИЖНЫЙ ШКАФ (4 полки по 25 книг) ----------
            const bookshelf = document.getElementById("bookshelf");

            // Звуки для полок:
            // 1 полка: случайные звуки из "музыки" (25) — используем ноты из пентатоники / аккордов
            // 2 полка: звуки животных — используем короткие синтезированные "крики" через специальные настройки
            // 3 полка: звуки природы — шумы, но мы сделаем синтез
            // 4 полка: пустая (для пользовательских звуков) — просто книги без звука?
            //     По заданию "оставь мне четвертую полку, чтобы я могла добавить свои звуки самостоятельно".
            //     Поэтому на четвертой полке книги будут без звука (или с заглушкой), но их можно будет позже назначить.
            //     Сделаем их "пустыми" — при клике ничего не играет, но визуально они есть.

            // Но мы можем сделать четвертую полку с возможностью издать звук? Условие: "оставь мне четвертую полку, чтобы я могла добавить свои звуки самостоятельно".
            // Поэтому просто разместим на ней 25 книг без привязки к звукам (или с минимальным звуком-заглушкой, но лучше без звука).
            // Для звуков животных и природы используем разные типы осцилляторов и эффектов.

            // Создадим отдельные синтезаторы для книг (чтобы не конфликтовать с секвенсором)
            // Но чтобы не перегружать, будем создавать по одному синтезатору на клик (или переиспользовать).

            // Для музыки: используем PolySynth с мягкой атакой
            const musicSynth = new Tone.PolySynth(Tone.Synth, {
              oscillator: { type: "sine" },
              envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 1 },
            }).connect(reverb);

            // Для животных: более резкие звуки (triangle, быстрая атака)
            const animalSynth = new Tone.PolySynth(Tone.Synth, {
              oscillator: { type: "triangle" },
              envelope: {
                attack: 0.005,
                decay: 0.1,
                sustain: 0.05,
                release: 0.2,
              },
            }).connect(reverb);

            // Для природы: шумовые / свистящие (используем FMSynth или AMSynth)
            const natureSynth = new Tone.PolySynth(Tone.FMSynth, {
              harmonicity: 3,
              modulationIndex: 10,
              oscillator: { type: "sine" },
              envelope: { attack: 0.1, decay: 0.4, sustain: 0.2, release: 0.8 },
              modulation: { type: "square" },
              modulationEnvelope: {
                attack: 0.05,
                decay: 0.2,
                sustain: 0,
                release: 0.2,
              },
            }).connect(reverb);

            // Генерация массива звуков для полок
            // 1 полка: случайные ноты (музыка)
            const musicNotes = [
              "C4",
              "D4",
              "E4",
              "G4",
              "A4",
              "C5",
              "D5",
              "E5",
              "G5",
              "A5",
              "B4",
              "F4",
              "G3",
              "A3",
              "C3",
              "E3",
              "G3",
              "B3",
              "D4",
              "F4",
              "A4",
              "C5",
              "E5",
              "G5",
              "B5",
            ];
            // 2 полка: "животные" — используем высокие ноты и быстрые случайные интервалы, но подпишем как animal sounds
            const animalNotes = [
              "C5",
              "E5",
              "G5",
              "B5",
              "D6",
              "F#5",
              "A5",
              "C6",
              "E6",
              "G6",
              "B6",
              "C7",
              "D7",
              "E7",
              "F#6",
              "G#6",
              "A#6",
              "C7",
              "D#7",
              "F7",
              "G7",
              "A7",
              "B7",
              "C8",
              "D8",
            ];
            // 3 полка: природа — более низкие и плавные
            const natureNotes = [
              "C3",
              "E3",
              "G3",
              "A3",
              "C4",
              "D4",
              "E4",
              "G4",
              "A4",
              "C5",
              "D5",
              "E5",
              "G5",
              "A5",
              "B5",
              "C6",
              "D6",
              "E6",
              "G6",
              "A6",
              "B6",
              "C7",
              "D7",
              "E7",
              "G7",
            ];

            // Функция создания книги
            function createBook(
              colorClass,
              heightPercent,
              soundType,
              note,
              index,
            ) {
              const book = document.createElement("div");
              book.className = `book ${colorClass}`;
              // Случайная высота от 50% до 95% (хаотичность)
              const height = 50 + Math.random() * 45;
              book.style.height = height + "%";
              // Случайная ширина от 14 до 22px
              const width = 14 + Math.floor(Math.random() * 10);
              book.style.width = width + "px";
              // Небольшой случайный сдвиг по вертикали для хаоса
              const yShift = Math.random() * 8 - 4;
              book.style.marginTop = yShift + "px";
              // Случайный поворот для книг? Нет, оставим ровными, но можно чуть-чуть
              // book.style.transform = `rotate(${Math.random() * 2 - 1}deg)`;

              // Подпись не добавляем, но можно легко добавить:
              // book.textContent = ...;

              // Обработчик клика
              book.addEventListener("click", () => {
                // Воспроизводим звук в зависимости от полки
                if (soundType === "music") {
                  musicSynth.triggerAttackRelease(note, "8n");
                } else if (soundType === "animal") {
                  animalSynth.triggerAttackRelease(note, "16n");
                } else if (soundType === "nature") {
                  natureSynth.triggerAttackRelease(note, "4n");
                } else if (soundType === "custom") {
                  // Четвертая полка — пока без звука (пользователь добавит позже)
                  // Можно сделать визуальный отклик
                  book.style.transform = "scale(0.9)";
                  setTimeout(() => (book.style.transform = ""), 150);
                  // Или тихий щелчок? Нет, оставим пустым.
                }
              });

              return book;
            }

            // Цвета для книг (хаотично)
            const colorClasses = [
              "book-color-1",
              "book-color-2",
              "book-color-3",
              "book-color-4",
              "book-color-5",
              "book-color-6",
            ];

            // Заполняем 4 полки
            for (let shelfIndex = 0; shelfIndex < 4; shelfIndex++) {
              const shelf = document.createElement("div");
              shelf.className = "shelf-row";
              shelf.dataset.shelf = shelfIndex;

              let soundType, notesArray;
              if (shelfIndex === 0) {
                soundType = "music";
                notesArray = musicNotes;
              } else if (shelfIndex === 1) {
                soundType = "animal";
                notesArray = animalNotes;
              } else if (shelfIndex === 2) {
                soundType = "nature";
                notesArray = natureNotes;
              } else {
                soundType = "custom"; // четвертая полка — для пользователя
                notesArray = new Array(25).fill(""); // без нот
              }

              for (let i = 0; i < 25; i++) {
                const colorClass =
                  colorClasses[Math.floor(Math.random() * colorClasses.length)];
                let note = "";
                if (soundType !== "custom") {
                  note = notesArray[i % notesArray.length]; // циклично, чтобы все 25 были разными (но могут повторяться, что нормально)
                  // Немного разнообразия: иногда сдвигаем на октаву для музыки
                  if (soundType === "music" && Math.random() > 0.7) {
                    // повышаем на октаву
                    note = note.replace(/\d/, (d) =>
                      (parseInt(d) + 1).toString(),
                    );
                  }
                }
                const book = createBook(colorClass, 70, soundType, note, i);
                shelf.appendChild(book);
              }

              bookshelf.appendChild(shelf);
            }

            // ---------- 8. ИНИЦИАЛИЗАЦИЯ СЕКВЕНСОРА ----------
            renderSequencer();

            // Устанавливаем стартовые значения слайдеров
            volSlider.value = 70;
            revSlider.value = 25;
            bpmSlider.value = 100;
            updateVolume(70);
            reverb.wet.value = 0.25;

            // Для корректной работы Tone.js при первом клике
            window.addEventListener(
              "click",
              () => {
                if (Tone.context.state !== "running") {
                  Tone.start();
                }
              },
              { once: true },
            );

            // Останавливаем при закрытии страницы
            window.addEventListener("beforeunload", () => {
              if (isPlaying) {
                Tone.Transport.stop();
              }
            });

            // Сброс статуса
            statusDisplay.textContent = "READY";
          })();
        </script>
      </body>
    </html>
  </body>
</html>
